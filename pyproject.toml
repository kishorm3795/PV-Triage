[project]
name = "pv-triage"
version = "0.1.0"
description = "Pharmacovigilance Triage System - Multi-agent LLM pipeline for adverse event assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "sentence-transformers>=2.2",
    "chromadb>=1.0",
    "prometheus-client>=0.19",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pypdf>=5.0",
    "fitz>=0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
eval = [
    "ragas>=0.2",
    "transformers>=4.40",
    "torch>=2.3",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "agents/tests",
    "guardrails/tests",
    "llm/tests",
    "prompts/tests",
    "pipeline/tests",
    "eval/tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008", "SIM117"]
per-file-ignores = { "tests/*" = ["T201", "S101"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.venv
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.pytest_cache
  | agents/out
  | __pypackages__
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true

[tool.mypy-overrides]
module = [
    "langgraph.*",
    "langchain_core.*",
    "chromadb.*",
    "sentence_transformers.*",
    "prometheus_client.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["agents", "guardrails", "llm", "prompts", "pipeline", "shared", "eval"]
omit = ["*/tests/*", "*/test_*.py", "*_test.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
