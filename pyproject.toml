[project]
name = "pv-triage"
version = "0.1.0"
description = "Pharmacovigilance Triage System - Multi-agent LLM pipeline for adverse event assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "sentence-transformers>=2.2",
    "chromadb>=0.4",
    "prometheus-client>=0.19",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "redis>=5.0",
    "rq>=1.16",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
    "build>=1.0",
    "twine>=5.0",
]
eval = [
    "transformers>=4.40",
    "torch>=2.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "backend",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
pythonpath = [
    "backend",
    "scripts",
    ".",
]

[tool.ruff]
line-length = 100
target-version = "py311"
ignore = ["E501", "B008", "SIM117"]

[tool.black]
line-length = 100
target-version = ["py311"]
