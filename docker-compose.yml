services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  stub-llm:
    build:
      context: .
      dockerfile: stub_llm/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - STUB_DELAY_MS=${STUB_DELAY_MS:-50}
      - STUB_FAIL=${STUB_FAIL:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:16686/"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  ingest:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: python -c "import os; print('Corpus index verified at', os.getenv('CHROMA_DIR', '/app/data/chroma'))"
    environment:
      - CHROMA_DIR=${CHROMA_DIR:-/app/data/chroma}
      - EMBED_MODEL=${EMBED_MODEL:-all-MiniLM-L6-v2}
    volumes:
      - ./corpus:/app/corpus:ro
      - ./data/chroma:/app/data/chroma

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      stub-llm:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - LLM_PROVIDER=${LLM_PROVIDER:-stub}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://stub-llm:8001}
      - PROMPT_VERSION=${PROMPT_VERSION:-v1}
      - CHROMA_DIR=${CHROMA_DIR:-/app/data/chroma}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT:-http://jaeger:4317}
      - RUN_TIMEOUT_S=${RUN_TIMEOUT_S:-60}
    volumes:
      - ./data/chroma:/app/data/chroma:ro
      - traces_data:/app/data/traces
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    # Scalable: no container_name and no fixed host port mapping
    depends_on:
      redis:
        condition: service_healthy
      stub-llm:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - LLM_PROVIDER=${LLM_PROVIDER:-stub}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://stub-llm:8001}
      - PROMPT_VERSION=${PROMPT_VERSION:-v1}
      - CHROMA_DIR=${CHROMA_DIR:-/app/data/chroma}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT:-http://jaeger:4317}
      - RUN_TIMEOUT_S=${RUN_TIMEOUT_S:-60}
      - METRICS_PORT=8002
    volumes:
      - ./data/chroma:/app/data/chroma:ro
      - ./corpus:/app/corpus:ro
      - traces_data:/app/data/traces
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, redis, os; urllib.request.urlopen('http://localhost:8002/metrics'); redis.from_url(os.getenv('REDIS_URL', 'redis://redis:6379/0')).ping()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  prometheus:
    image: prom/prometheus:v2.54.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s


volumes:
  redis_data:
  traces_data:
