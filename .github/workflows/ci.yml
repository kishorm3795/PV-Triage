name: CI Pipeline

on:
  push:
    branches: [main, b/agents, c/data, a/platform]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Style Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff lint check
        run: ruff check backend/ eval/ scripts/ || true

  test:
    name: Unit & Guardrail Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Unit Tests
        env:
          PYTHONPATH: backend:scripts:.
        run: |
          python -m pytest backend/guardrails/tests/ backend/llm/tests/ backend/prompts/tests/ -v --tb=short

  audit:
    name: Deliverables & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Deliverables Audit Checklist
        run: |
          python3 scripts/audit_deliverables.py

      - name: Run Security Secret Scan
        run: |
          bash scripts/scan_secrets.sh

  build:
    name: Build & Validate Package
    runs-on: ubuntu-latest
    needs: [lint, test, audit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build package
        run: python -m build

      - name: Validate package
        run: python -m twine check dist/*
