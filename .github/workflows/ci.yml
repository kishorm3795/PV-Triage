name: CI Pipeline

on:
  push:
    branches: [main, b/agents, c/data, a/platform]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff lint
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Run Mypy type check
        run: mypy agents guardrails llm prompts pipeline shared eval --ignore-missing-imports || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest agents/tests/ guardrails/tests/ llm/tests/ prompts/tests/ pipeline/tests/ -v --tb=short

  integration:
    name: Integration Tests (Phase 4-6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Run Phase 4 guardrail tests
        run: |
          python -m pytest agents/tests/test_phase4.py -v

      - name: Run batch evaluation (v1)
        env:
          RETRIEVER: mock
          SCORER: local
        run: |
          python -m agents.batch --prompt-version v1 --quiet

      - name: Run batch evaluation (v2)
        env:
          RETRIEVER: mock
          SCORER: local
        run: |
          python -m agents.batch --prompt-version v2 --quiet

  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Validate package
        run: python -m twine check dist/*

  # Optional: Deploy to test environment on merge to main
  deploy-test:
    name: Deploy to Test
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: test
    steps:
      - name: Deploy placeholder
        run: echo "Deploy to test environment - implement as needed"

